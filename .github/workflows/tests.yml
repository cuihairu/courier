# 测试门禁:push/PR 全仓跑一遍(与本地口径一致,零依赖,无平台专属环境)。
#
# 覆盖:Go(gateway 模块 + 根模块 tools:contractgen/packcheck/tsync)、Node 24 原生 TS
# (cocos / miniprogram / laybox,零依赖 node --test)、UE(ISO C++17
# 独立编译,g++ 无引擎依赖)、Unity 四个纯逻辑 dotnet 工程(dotnet test,
# 引擎运行时不进门禁)。
#
# 不覆盖:引擎本体运行时 —— unity 引擎内 Test Runner 用例、godot headless 用例
# (本机 godot 4.3 可跑,CI 未装引擎)。
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    name: go (gateway + contractgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: root module tools
        run: go test ./tools/...
      - name: vet (root module)
        run: go vet ./...
      - name: vet (gateway)
        run: go vet ./...
        working-directory: gateway
      - name: gateway
        run: go test ./...
        working-directory: gateway

  node-sdks:
    name: node ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [cocos, miniprogram, laybox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test
        run: node --test tests/*.test.ts
        working-directory: sdks/${{ matrix.sdk }}

  unity-dotnet:
    name: unity (dotnet pure-logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet test (four projects)
        run: |
          for t in ContractTests~ CoreTests~ ServiceTests~ DiagnosticsTests~; do
            (cd "sdks/unity/$t" && dotnet test)
          done

  ue:
    name: ue (c++17 headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run_tests.sh
        run: sh sdks/ue/run_tests.sh
