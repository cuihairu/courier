# 测试门禁:push/PR 全仓跑一遍(与本地口径一致,仓内零三方依赖,无平台专属环境)。
#
# 覆盖:Go(gateway 模块 + 根模块 tools:contractgen/packcheck/tsync,均 -race;外加 govulncheck
# 双模块可达性扫描,需联网拉 vuln DB——仓内零三方依赖,唯一供应链面是 Go 标准库/工具链)、
# Node 24 原生 TS
# (cocos / miniprogram / laybox,零依赖 node --test)、UE(ISO C++17
# 独立编译,g++ 无引擎依赖)、Unity 四个纯逻辑 dotnet 工程(dotnet test,
# 引擎运行时不进门禁)、六端示例(起本地网关实跑 examples/,godot 端除外)。
#
# 不覆盖:引擎本体运行时 —— unity 引擎内 Test Runner 用例、godot headless 用例
# (本机 godot 4.3 可跑,CI 未装引擎;godot 示例同此口径,本地实跑验证)。
name: Tests

on:
  push:
    branches: [main]
    # 文档改动不编译(README「本地测试口径」规则 1):仅按扩展名排除,不整树
    # 排除 docs/**——docs/contract/fixtures/*.json 是 contractgen 的测试输入
    # (契约漂移守卫),改动它必须跑测试。
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.svg'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    name: go (gateway + contractgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: root module tools
        run: go test -race ./tools/...
      - name: vet (root module)
        run: go vet ./...
      - name: vet (gateway)
        run: go vet ./...
        working-directory: gateway
      - name: gateway
        run: go test -race ./...
        working-directory: gateway
      - name: govulncheck (root + gateway)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          (cd gateway && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)

  node-sdks:
    name: node ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [cocos, miniprogram, laybox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test
        run: node --test tests/*.test.ts
        working-directory: sdks/${{ matrix.sdk }}

  unity-dotnet:
    name: unity (dotnet pure-logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: dotnet test (four projects)
        run: |
          for t in ContractTests~ CoreTests~ ServiceTests~ DiagnosticsTests~; do
            (cd "sdks/unity/$t" && dotnet test)
          done

  ue:
    name: ue (c++17 headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run_tests.sh
        run: sh sdks/ue/run_tests.sh

  examples:
    name: examples (six-end e2e vs local gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build and boot gateway
        run: |
          (cd gateway && go build -o /tmp/courier-gateway ./cmd/gateway)
          COURIER_GATEWAY_ADDR=:18099 /tmp/courier-gateway &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18099/healthz && break; sleep 0.5; done
      - name: ts examples (cocos / miniprogram / laybox)
        run: |
          for sdk in cocos miniprogram laybox; do
            COURIER_ENDPOINT=http://127.0.0.1:18099 node "examples/$sdk/example.ts"
          done
      - name: unity example (dotnet pure-logic)
        run: dotnet run --project examples/unity -- http://127.0.0.1:18099
      - name: ue example (c++17 headless)
        run: |
          g++ -std=c++17 -Wall -Wextra examples/ue/example.cpp \
            -Isdks/ue/service -Isdks/ue/core -Isdks/ue/contract -o /tmp/ue_example
          /tmp/ue_example http://127.0.0.1:18099
