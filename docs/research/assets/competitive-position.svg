<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="19" font-weight="700" fill="#1f2937">竞品取位:品类空位在「开源 × 服务递送」象限(2026-10-08)</text>

  <!-- plot frame -->
  <rect x="120" y="70" width="700" height="400" fill="#fafafa" stroke="#e5e7eb"/>
  <line x1="120" y1="270" x2="820" y2="270" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="470" y1="70" x2="470" y2="470" stroke="#e5e7eb" stroke-dasharray="4 4"/>

  <!-- axes -->
  <line x1="120" y1="470" x2="830" y2="470" stroke="#374151" stroke-width="1.5"/>
  <polygon points="830,470 820,465 820,475" fill="#374151"/>
  <line x1="120" y1="470" x2="120" y2="60" stroke="#374151" stroke-width="1.5"/>
  <polygon points="120,60 115,70 125,70" fill="#374151"/>
  <text x="820" y="492" font-size="14" fill="#374151" text-anchor="end">服务递送 / 运营支撑 →</text>
  <text x="128" y="492" font-size="14" fill="#374151">← 实时对战 / 玩法服务器</text>
  <text x="108" y="80" font-size="14" fill="#374151" text-anchor="end">商业闭源</text>
  <text x="108" y="460" font-size="14" fill="#374151" text-anchor="end">开源</text>

  <!-- the open slot -->
  <ellipse cx="625" cy="385" rx="150" ry="62" fill="#10b981" opacity="0.10"/>
  <ellipse cx="625" cy="385" rx="150" ry="62" fill="none" stroke="#10b981" stroke-dasharray="6 4" stroke-width="2"/>

  <!-- commercial top -->
  <g font-size="14" fill="#374151">
    <circle cx="500" cy="120" r="9" fill="#8b5cf6"/>
    <text x="516" y="118">腾讯 MSDK(渠道聚合 · 模块化选装)</text>
    <circle cx="600" cy="92" r="9" fill="#8b5cf6"/>
    <text x="616" y="90">QuickSDK(渠道聚合 · 服务端验签)</text>
    <circle cx="700" cy="150" r="9" fill="#8b5cf6"/>
    <text x="716" y="148">XDSDK(发行 · 实名防沉迷)</text>
    <circle cx="430" cy="185" r="9" fill="#f59e0b"/>
    <text x="446" y="183">AWS Game Backend(云绑定模板)</text>
  </g>

  <!-- open source bottom -->
  <g font-size="14" fill="#374151">
    <circle cx="215" cy="330" r="9" fill="#3b82f6"/>
    <text x="231" y="328">Agones(专用服编排)</text>
    <circle cx="255" cy="395" r="11" fill="#3b82f6"/>
    <text x="273" y="393">Nakama(实时多人/匹配/聊天)</text>
    <circle cx="330" cy="290" r="9" fill="#3b82f6"/>
    <text x="346" y="288">Playgama Bridge(Web 平台抽象)</text>
    <circle cx="545" cy="420" r="9" fill="#9ca3af"/>
    <text x="561" y="418">OpenGB(2024 起停更)</text>
    <circle cx="700" cy="445" r="9" fill="#9ca3af"/>
    <text x="716" y="443">XtraLife(无人维护)</text>
  </g>

  <!-- Courier -->
  <g>
    <path d="M 625 371 l 4.1 8.4 9.2 1.3 -6.7 6.5 1.6 9.1 -8.2 -4.3 -8.2 4.3 1.6 -9.1 -6.7 -6.5 9.2 -1.3 z" fill="#059669" stroke="#065f46"/>
    <text x="625" y="412" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Courier</text>
    <text x="625" y="365" font-size="13" fill="#059669" text-anchor="middle">品类空位:开源 · 服务递送聚合 SDK</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#4b5563">
    <circle cx="140" cy="530" r="7" fill="#3b82f6"/><text x="154" y="535">开源 · 活跃</text>
    <circle cx="258" cy="530" r="7" fill="#9ca3af"/><text x="272" y="535">开源 · 停滞</text>
    <circle cx="380" cy="530" r="7" fill="#8b5cf6"/><text x="394" y="535">商业闭源</text>
    <circle cx="482" cy="530" r="7" fill="#f59e0b"/><text x="496" y="535">云绑定模板</text>
    <path d="M 588 523 l 3.1 6.3 6.9 1 -5 4.9 1.2 6.8 -6.2 -3.2 -6.2 3.2 1.2 -6.8 -5 -4.9 6.9 -1 z" fill="#059669"/><text x="602" y="535">Courier 取位</text>
  </g>
</svg>
